name: build

# 什么时候跑：
#   1. 手动点（Actions → build → Run workflow），可指定主项目仓库/ref
#   2. 打 tag（v1.0.0）
on:
  workflow_dispatch:
    inputs:
      core_repo:
        description: "主项目仓库（官方默认；测未合并的分支时填 fork 地址）"
        default: "https://github.com/NIO-SAI/etf-option-board"
        required: true
      core_ref:
        description: "主项目分支/tag/commit"
        default: master
        required: true
  push:
    tags: ["v*"]

env:
  # Windows runner 的默认输出编码是 cp1252，中文日志会直接崩
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # tag 触发时 inputs 为空，靠 || 兜底成官方 master
  CORE_REPO: ${{ inputs.core_repo || 'https://github.com/NIO-SAI/etf-option-board' }}
  CORE_REF: ${{ inputs.core_ref || 'master' }}

jobs:
  # Windows：本机已验证过，产物解压即用
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 取主项目代码
        run: python scripts/prepare_core.py --repo "${{ env.CORE_REPO }}" --ref "${{ env.CORE_REF }}" --build-web
      - name: 打包
        run: python -m PyInstaller packaging/etf_board.spec --noconfirm
      - uses: actions/upload-artifact@v7
        with:
          name: EtfBoard-windows-x64
          path: dist/EtfBoard/**

  # macOS：Intel 与 Apple Silicon 各打一份（macos-13/14 已退役，用 -15 系列），
  # 不合并成 universal2 —— 双架构要重装所有依赖，收益不如两个包直接
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel     # Intel x64（macos-13/14 已下线）
            arch: x64
          - runner: macos-15           # Apple Silicon arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 取主项目代码
        run: python scripts/prepare_core.py --repo "${{ env.CORE_REPO }}" --ref "${{ env.CORE_REF }}" --build-web
      - name: 打包
        run: python -m PyInstaller packaging/etf_board.spec --noconfirm
      - name: ad-hoc 签名
        run: codesign --force --deep --sign - dist/EtfBoard.app
      - name: 压缩（保住可执行位和符号链接）
        run: ditto -c -k --keepParent dist/EtfBoard.app EtfBoard-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: EtfBoard-macos-${{ matrix.arch }}
          path: EtfBoard-macos-${{ matrix.arch }}.zip
